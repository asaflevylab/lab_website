# Levy lab website - Hugo configuration.
#
# Deliberately plain: no theme, no modules, no npm. Everything the site needs is
# in this repo, so a `hugo` binary years from now still builds it.

# Absolute, and set HERE rather than passed as `hugo -b $CF_PAGES_URL` on the
# Cloudflare build command: that variable is the PER-DEPLOYMENT hostname, so the
# build was writing https://<hash>.levylab.pages.dev into sitemap.xml and into
# every alias page's redirect. Since /contact/ and /in-the-media/ are reachable
# only by redirect, an old Wix inbound link landed a visitor on a frozen snapshot
# that never updates again. Keeping it in the repo means go-live on
# asaflevylab.com is a one-line edit here, with no dashboard visit.
# Requires the Cloudflare build command to be plain `hugo` - a -b flag wins over
# this value. Trade-off accepted: preview deploys now also emit these absolute
# URLs, which is harmless for an unlinked preview.
baseURL = "https://levylab.pages.dev/"
locale = "en-gb"
title = "Levy Lab"
enableRobotsTXT = true

# Wix served ugly paths (/copy-of-research, /lab-members-1). The new paths are
# clean, and each page carries an `aliases` entry so old inbound links redirect
# instead of 404ing.
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Bacteria don't just survive: they fight, infiltrate, and adapt."
  institution = "The Hebrew University of Jerusalem"
  department = "Department of Plant Pathology and Microbiology"

  # The four affiliation lines exactly as the Wix footer printed them, in order.
  affiliation = [
    "Department of Plant Pathology and Microbiology",
    "Institute of Environmental Sciences",
    "The Robert H. Smith Faculty of Agriculture, Food & Environment",
    "The Hebrew University of Jerusalem",
  ]
  email = "alevy@mail.huji.ac.il"   # as printed on the Wix contact page

  # Palette read out of the Wix theme's CSS custom properties, not eyeballed.
  # Contrast against white, computed: indigo 7.33:1, grey-mid 5.59:1,
  # green 3.50:1 - the green is therefore NOT used for body text anywhere.
  [params.palette]
    indigo = "#3D4DAD"
    indigoTint = "#F2F4FA"
    green = "#51985C"
    black = "#000000"
    greyDark = "#333333"
    greyMid = "#666666"
    greyLine = "#E6E7E8"

  # Oswald is OFL, so the headings carry across from Wix exactly. Avenir LT is
  # licensed to Wix and cannot be self-hosted, so the body font is Figtree
  # pending the side-by-side comparison in the design pass.
  [params.fonts]
    heading = "Oswald"
    body = "Figtree"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Research"
    pageRef = "/research"
    weight = 20
  [[menus.main]]
    name = "Lab Members"
    pageRef = "/people"
    weight = 30
  [[menus.main]]
    name = "Publications"
    pageRef = "/publications"
    weight = 40
  [[menus.main]]
    name = "Lab Life"
    pageRef = "/lab-life"
    weight = 50
  # 2026-11-04: nav cut 8 -> 6. Open Positions + Contact merged into one page,
  # In The Media dropped. Both old paths survive as aliases on their new homes,
  # because /open-positions, /contact and /in-the-media are real Wix URLs with
  # inbound links. data/media.yaml and layouts/media.html are kept, unpublished,
  # so restoring that page is re-adding one content file.
  [[menus.main]]
    name = "Join Us"
    pageRef = "/join"
    weight = 60

[markup.goldmark.renderer]
  unsafe = true  # publication titles carry <i>...</i> for species names

[build]
  writeStats = false
